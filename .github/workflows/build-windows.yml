name: Build Windows App

on:
  workflow_dispatch:
    inputs:
      upload_artifacts:
        description: 'Upload Windows build installers as workflow artifacts'
        type: boolean
        required: false
        default: true
  pull_request:
    branches:
      - main
    paths:
      - 'src-tauri/**'
      - 'client/**'
      - 'package.json'
      - 'package-lock.json'

permissions:
  contents: read

jobs:
  build-windows:
    name: Build Windows Desktop App
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            client/package-lock.json

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust Dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: 'src-tauri -> target'

      - name: Install Root Dependencies
        run: npm ci

      - name: Sync App Version
        run: node .github/scripts/sync-version.js "${{ github.ref_name }}"

      - name: Install Client Dependencies
        working-directory: client
        run: npm ci

      - name: Build Client Web Assets
        working-directory: client
        run: npm run build

      - name: Build Windows Desktop App (Production)
        run: npx tauri build
        env:
          CI: true

      - name: Upload Windows Installers
        if: github.event_name != 'workflow_dispatch' || inputs.upload_artifacts
        uses: actions/upload-artifact@v4
        with:
          name: watch-together-windows-x64
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
          retention-days: 14
